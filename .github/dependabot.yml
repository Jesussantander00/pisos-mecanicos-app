# Configuración de Dependabot (gratis, ya viene incluido en GitHub).
#
# Qué hace: una vez a la semana, GitHub revisa las dependencias de este proyecto (las de
# package.json — React, Supabase, web-push, etc.) contra su base de datos de vulnerabilidades
# conocidas, y si encuentra alguna, abre solo un Pull Request avisando (con el cambio de versión
# ya armado, listo para revisar y aceptar). No cambia nada solo, no rompe nada solo — el que decide
# si se aprueba el PR sigues siendo tú.
#
# Cómo activarlo: solo hace falta que este archivo exista en la carpeta ".github" en la raíz del
# repositorio de GitHub del proyecto (al mismo nivel que "package.json", "src", etc.) — no hay que
# instalar nada ni configurar nada más en Vercel ni en Supabase. GitHub lo detecta solo apenas el
# archivo esté en la rama principal.

version: 2
updates:
  # Dependencias de Node/npm (package.json) — React, Supabase, web-push, Vite, Tailwind, etc.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Agrupa SOLO las actualizaciones pequeñas y seguras (parches y versiones menores) en un único
    # Pull Request — esas casi nunca rompen nada, así que no hace falta revisarlas una por una.
    # Las actualizaciones GRANDES (ej. Vite 5 -> 6, Tailwind 3 -> 4) quedan A PROPÓSITO fuera de
    # este grupo, así que Dependabot las manda cada una en su propio Pull Request por separado —
    # si alguna rompe el build (como pasó con el combo de 14), se identifica y se descarta sola,
    # sin arrastrar consigo las demás actualizaciones que sí funcionaban bien.
    groups:
      dependencias:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "dependencias"
    commit-message:
      prefix: "deps"

  # Las propias GitHub Actions, si el proyecto llega a usar alguna (ej. un flujo de build-check) —
  # se deja configurado de una vez para que no haga falta acordarse después.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
